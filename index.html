<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Научный Соавтор | Поиск команды</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Шапка сайта -->
    <header class="bg-white shadow sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600">НаучныйСоавтор</h1>
            <div class="flex items-center gap-4">
                <div id="auth-block" class="flex items-center gap-2">
                    <button id="loginBtn" class="text-blue-600 font-medium hover:underline">Войти / Регистрация</button>
                </div>
                <button id="openModalBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition">
                    + Создать объявление
                </button>
            </div>
        </div>
    </header>

    <!-- Основная часть -->
    <main class="max-w-5xl mx-auto px-4 py-8">
        <h2 class="text-xl font-semibold mb-4">Ищу соавтора</h2>
        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <input type="text" id="searchInput" placeholder="Поиск по названию..." class="w-full md:w-1/2 border border-gray-300 rounded-lg px-4 py-2">
            <select id="filterRole" class="w-full md:w-1/2 border border-gray-300 rounded-lg px-4 py-2">
                <option value="">Все роли (Кто нужен?)</option>
                <option value="Теоретик">Теоретик</option>
                <option value="Практик (врач)">Практик (врач)</option>
                <option value="Дизайнер">Дизайнер</option>
                <option value="Гуманитарий">Гуманитарий</option>
            </select>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- МОДАЛЬНОЕ ОКНО ДЕТАЛЬНОГО ПРОСМОТРА ПРОЕКТА -->
    <div id="detailModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-2xl mx-4 relative max-h-[90vh] overflow-y-auto">
            <button id="closeDetailBtn" class="absolute top-4 right-4 text-gray-500 hover:text-red-500 font-bold text-xl bg-white rounded-full p-1 z-10">&times;</button>
            <img id="detail-image" src="" class="w-full h-64 object-cover rounded-t-xl hidden">
            <div class="p-6">
                <h2 id="detail-title" class="text-3xl font-bold mb-2"></h2>
                <p class="text-gray-500 mb-4">Нужен: <span id="detail-role" class="font-bold text-blue-600"></span> | Сроки: <span id="detail-deadline"></span></p>
                
                <div class="bg-gray-50 p-4 rounded-lg mb-4 border">
                    <h3 class="font-bold text-gray-800 mb-2">Описание:</h3>
                    <p id="detail-desc" class="text-gray-700 whitespace-pre-wrap"></p>
                </div>

                <!-- БЛОК УЧАСТНИКОВ -->
                <div class="mb-6 border-b pb-4">
                    <h3 class="font-bold text-gray-800 mb-2">Участники проекта:</h3>
                    <div id="detail-members-list" class="flex flex-wrap gap-2"></div>
                </div>

                <!-- БЛОК ФАЙЛОВ ПРОЕКТА -->
                <div class="bg-blue-50 p-4 rounded-lg mb-6 border border-blue-200">
                    <h3 class="font-bold text-blue-900 mb-2 flex items-center gap-2">📁 Файлы проекта</h3>
                    <div id="detail-files-list" class="flex flex-col gap-2 mb-3"></div>
                    
                    <div id="upload-file-container" class="hidden border-t border-blue-200 pt-3 mt-3">
                        <form id="uploadFileForm" class="flex gap-2 items-center">
                            <input type="file" id="project-file-input" required class="text-sm text-gray-600 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
                            <button type="submit" id="uploadFileBtn" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded-lg font-bold transition whitespace-nowrap">Загрузить</button>
                        </form>
                    </div>
                    <p id="no-files-msg" class="text-sm text-gray-500 italic">Файлов пока нет.</p>
                </div>

                <div class="flex justify-between items-center border-t pt-4">
                    <div>
                        <p class="text-sm text-gray-500">Автор:</p>
                        <p id="detail-author" class="font-bold text-lg text-gray-800"></p>
                    </div>
                    <div id="detail-actions" class="flex gap-3">
                        <!-- Кнопки -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ЗАЯВОК -->
    <div id="requestsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-lg mx-4 relative flex flex-col h-[80vh]">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h3 class="font-bold text-lg text-gray-800">Заявки на проекты</h3>
                <button id="closeRequestsBtn" class="text-gray-500 hover:text-red-500 font-bold text-2xl">&times;</button>
            </div>
            <div id="requestsList" class="flex-grow p-4 overflow-y-auto bg-gray-100 flex flex-col gap-2"></div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: СПИСОК ЧАТОВ -->
    <div id="inboxModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-lg mx-4 relative flex flex-col h-[80vh]">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                <h3 class="font-bold text-lg text-gray-800">Мои чаты</h3>
                <button id="closeInboxBtn" class="text-gray-500 hover:text-red-500 font-bold text-2xl">&times;</button>
            </div>
            <div id="inboxList" class="flex-grow p-4 overflow-y-auto bg-gray-100 flex flex-col gap-2"></div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ЧАТА -->
    <div id="chatModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-lg mx-4 relative flex flex-col h-[80vh]">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl">
                <div>
                    <h3 class="font-bold text-lg text-gray-800" id="chatTitle">Чат</h3>
                    <p class="text-xs text-gray-500" id="chatSubtitle">Проект</p>
                </div>
                <div class="flex items-center gap-4">
                    <button id="reportBtn" class="text-orange-500 hover:text-orange-700 text-xl" title="Пожаловаться">🚩</button>
                    <button id="closeChatBtn" class="text-gray-500 hover:text-red-500 font-bold text-2xl">&times;</button>
                </div>
            </div>
            <div id="chatMessages" class="flex-grow p-4 overflow-y-auto bg-gray-100 flex flex-col gap-3"></div>
            <div class="p-4 border-t bg-white rounded-b-xl">
                <form id="chatForm" class="flex gap-2">
                    <input type="text" id="chatInput" required placeholder="Напишите сообщение..." class="flex-grow border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-lg transition">➤</button>
                </form>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ЖАЛОБЫ -->
    <div id="reportModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md mx-4 relative">
            <button id="closeReportBtn" class="absolute top-4 right-4 text-gray-500 hover:text-red-500 font-bold text-xl">&times;</button>
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Пожаловаться</h2>
            <form id="reportForm" class="flex flex-col gap-4">
                <textarea id="report-reason" rows="3" required placeholder="Что случилось?" class="w-full border border-gray-300 rounded-lg px-3 py-2"></textarea>
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg">Отправить жалобу</button>
            </form>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО СОЗДАНИЯ/РЕДАКТИРОВАНИЯ ПРОЕКТА -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md mx-4 relative max-h-[90vh] overflow-y-auto">
            <button id="closeModalBtn" class="absolute top-4 right-4 text-gray-500 hover:text-red-500 font-bold text-xl">&times;</button>
            <h2 id="modalTitle" class="text-2xl font-bold mb-4 text-gray-800">Новое объявление</h2>
            <form id="projectForm" class="flex flex-col gap-4">
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Тема</label><input type="text" id="input-title" required class="w-full border border-gray-300 rounded-lg px-3 py-2"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Сроки</label><input type="text" id="input-deadline" class="w-full border border-gray-300 rounded-lg px-3 py-2"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Кто нужен?</label>
                    <select id="input-role" class="w-full border border-gray-300 rounded-lg px-3 py-2"><option>Теоретик</option><option>Практик (врач)</option><option>Дизайнер</option><option>Гуманитарий</option></select>
                </div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Краткое описание</label><textarea id="input-desc" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2"></textarea></div>
                <div class="border border-gray-200 p-3 rounded-lg bg-gray-50">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Картинка (обложка)</label>
                    <div id="current-image-container" class="hidden mb-3 flex items-center gap-3">
                        <img id="current-image-preview" src="" class="h-16 w-16 object-cover rounded-lg border border-gray-300">
                        <label class="flex items-center gap-2 text-sm text-red-600 cursor-pointer bg-red-50 px-3 py-1.5 rounded-lg hover:bg-red-100 transition"><input type="checkbox" id="delete-image-checkbox"> Удалить</label>
                    </div>
                    <input type="file" id="input-image" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200">
                </div>
                <button type="submit" id="submitBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg mt-2">Опубликовать</button>
            </form>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПРОФИЛЯ -->
    <div id="profileModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md mx-4 relative">
            <button id="closeProfileBtn" class="absolute top-4 right-4 text-gray-500 hover:text-red-500 font-bold text-xl">&times;</button>
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Мой профиль</h2>
            <form id="profileForm" class="flex flex-col gap-4">
                <div><label class="block text-sm font-medium text-gray-700 mb-1">ФИО/Имя</label><input type="text" id="profile-name" required class="w-full border border-gray-300 rounded-lg px-3 py-2"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Университет</label><input type="text" id="profile-university" class="w-full border border-gray-300 rounded-lg px-3 py-2"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Факультет / Курс</label><input type="text" id="profile-faculty" class="w-full border border-gray-300 rounded-lg px-3 py-2"></div>
                <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg mt-2">Сохранить профиль</button>
            </form>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО АВТОРИЗАЦИИ -->
    <div id="authModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md mx-4 relative">
            <button id="closeAuthBtn" class="absolute top-4 right-4 text-gray-500 hover:text-red-500 font-bold text-xl">&times;</button>
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Вход в систему</h2>
            <form id="authForm" class="flex flex-col gap-4">
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Email</label><input type="email" id="auth-email" required class="w-full border border-gray-300 rounded-lg px-3 py-2"></div>
                <div><label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label><input type="password" id="auth-password" required class="w-full border border-gray-300 rounded-lg px-3 py-2"></div>
                <div class="flex gap-2 mt-2">
                    <button type="submit" id="loginSubmitBtn" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Войти</button>
                    <button type="button" id="signupSubmitBtn" class="w-1/2 bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg">Регистрация</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://afpqnklgtibofojlvjzm.supabase.co'; 
        const supabaseKey = 'sb_publishable_E023w2ojf9VIqr78rN5VWQ_jOu9uKDQ'; 
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        let allProjects = [];
        let allProfiles = []; 
        let myApprovedProjectIds = []; // Сюда запишем ID проектов, где мы участник
        let editingProjectId = null; 
        let activeChat = { receiverId: null, projectId: null, receiverName: '' };
        let currentDetailProjectId = null;
        let chatSubscription = null;
        let globalSubscription = null;

        const grid = document.querySelector('.grid');
        const authBlock = document.getElementById('auth-block');
        
        // --- УПРАВЛЕНИЕ ОКНАМИ ---
        document.getElementById('openModalBtn').addEventListener('click', () => { 
            if(!currentUser) { alert("Войдите в аккаунт!"); document.getElementById('authModal').classList.remove('hidden'); document.getElementById('authModal').classList.add('flex'); return; }
            editingProjectId = null; document.getElementById('modalTitle').innerText = "Новое объявление"; 
            document.getElementById('submitBtn').innerText = "Опубликовать"; document.getElementById('projectForm').reset(); document.getElementById('current-image-container').classList.add('hidden');
            document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('flex'); 
        });
        
        document.getElementById('closeModalBtn').addEventListener('click', () => { document.getElementById('modal').classList.add('hidden'); document.getElementById('modal').classList.remove('flex'); document.getElementById('projectForm').reset(); editingProjectId = null; });
        document.getElementById('closeDetailBtn').addEventListener('click', () => { document.getElementById('detailModal').classList.add('hidden'); document.getElementById('detailModal').classList.remove('flex'); });
        document.getElementById('closeAuthBtn').addEventListener('click', () => { document.getElementById('authModal').classList.add('hidden'); document.getElementById('authModal').classList.remove('flex'); });
        document.getElementById('closeProfileBtn').addEventListener('click', () => { document.getElementById('profileModal').classList.add('hidden'); document.getElementById('profileModal').classList.remove('flex'); });
        document.getElementById('closeReportBtn').addEventListener('click', () => { document.getElementById('reportModal').classList.add('hidden'); document.getElementById('reportModal').classList.remove('flex'); });
        document.getElementById('closeRequestsBtn').addEventListener('click', () => { document.getElementById('requestsModal').classList.add('hidden'); document.getElementById('requestsModal').classList.remove('flex'); });
        document.getElementById('closeInboxBtn').addEventListener('click', () => { document.getElementById('inboxModal').classList.add('hidden'); document.getElementById('inboxModal').classList.remove('flex'); });
        document.getElementById('closeChatBtn').addEventListener('click', () => {
            document.getElementById('chatModal').classList.add('hidden'); document.getElementById('chatModal').classList.remove('flex');
            if (chatSubscription) { supabaseClient.removeChannel(chatSubscription); chatSubscription = null; }
            activeChat = { receiverId: null, projectId: null };
        });

        // --- АВТОРИЗАЦИЯ И ЗАГРУЗКА ДАННЫХ ---
        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            updateAuthUI(session);
            supabaseClient.auth.onAuthStateChange((_event, session) => { updateAuthUI(session); });
        }

        async function updateAuthUI(session) {
            if (session) {
                currentUser = session.user;
                authBlock.innerHTML = `
                    <button id="myRequestsBtn" class="relative bg-yellow-100 text-yellow-700 hover:bg-yellow-200 px-3 py-1.5 rounded-lg text-sm font-medium transition">
                        Заявки <span id="requestsBadge" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold px-1.5 py-0.5 rounded-full hidden">0</span>
                    </button>
                    <button id="myInboxBtn" class="relative bg-blue-100 text-blue-700 hover:bg-blue-200 px-3 py-1.5 rounded-lg text-sm font-medium transition">
                        Мои чаты <span id="unreadBadge" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold px-1.5 py-0.5 rounded-full hidden">0</span>
                    </button>
                    <button id="myProfileBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-1.5 rounded-lg text-sm font-medium transition">Профиль</button>
                    <button id="logoutBtn" class="text-red-500 font-medium hover:underline text-sm ml-2">Выйти</button>
                `;
                
                document.getElementById('myRequestsBtn').addEventListener('click', openRequests);
                document.getElementById('myInboxBtn').addEventListener('click', openInbox);
                document.getElementById('myProfileBtn').addEventListener('click', () => {
                    const myProfile = allProfiles.find(p => p.id === currentUser.id);
                    document.getElementById('profile-name').value = myProfile?.full_name || '';
                    document.getElementById('profile-university').value = myProfile?.university || '';
                    document.getElementById('profile-faculty').value = myProfile?.faculty || '';
                    document.getElementById('profileModal').classList.remove('hidden'); document.getElementById('profileModal').classList.add('flex');
                });
                document.getElementById('logoutBtn').addEventListener('click', async () => { await supabaseClient.auth.signOut(); });

                await loadMyApprovedProjects();
                await updateUnreadBadge();
                setupGlobalRealtime();
            } else {
                currentUser = null;
                myApprovedProjectIds = [];
                if (globalSubscription) supabaseClient.removeChannel(globalSubscription);
                authBlock.innerHTML = `<button id="loginBtn" class="text-blue-600 font-medium hover:underline">Войти / Регистрация</button>`;
                document.getElementById('loginBtn').addEventListener('click', () => { document.getElementById('authModal').classList.remove('hidden'); document.getElementById('authModal').classList.add('flex'); });
            }
            await loadProfiles();
            loadProjects();
        }

        // Загружаем проекты, где мы одобрены
        async function loadMyApprovedProjects() {
            if (!currentUser) return;
            const { data } = await supabaseClient.from('join_requests').select('project_id').eq('user_id', currentUser.id).eq('status', 'approved');
            if (data) myApprovedProjectIds = data.map(d => String(d.project_id));
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await supabaseClient.auth.signInWithPassword({ email: document.getElementById('auth-email').value, password: document.getElementById('auth-password').value });
            if (!error) { document.getElementById('authModal').classList.add('hidden'); document.getElementById('authModal').classList.remove('flex'); document.getElementById('authForm').reset(); }
            else alert(error.message);
        });

        document.getElementById('signupSubmitBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const { error } = await supabaseClient.auth.signUp({ email: document.getElementById('auth-email').value, password: document.getElementById('auth-password').value });
            if (!error) alert("Успех! Теперь войдите."); else alert(error.message);
        });

        async function loadProfiles() {
            const { data } = await supabaseClient.from('profiles').select('*');
            if (data) allProfiles = data;
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await supabaseClient.from('profiles').upsert({
                id: currentUser.id, email: currentUser.email,
                full_name: document.getElementById('profile-name').value,
                university: document.getElementById('profile-university').value,
                faculty: document.getElementById('profile-faculty').value
            });
            if (!error) { alert("Профиль сохранен!"); document.getElementById('profileModal').classList.add('hidden'); document.getElementById('profileModal').classList.remove('flex'); await loadProfiles(); loadProjects(); }
        });

        // --- УВЕДОМЛЕНИЯ ---
        async function updateUnreadBadge() {
            if (!currentUser) return;
            const { count } = await supabaseClient.from('messages').select('*', { count: 'exact', head: true }).eq('receiver_id', currentUser.id).eq('is_read', false);
            const badge = document.getElementById('unreadBadge');
            if (badge) {
                if (count > 0) { badge.innerText = count > 99 ? '99+' : count; badge.classList.remove('hidden'); }
                else { badge.classList.add('hidden'); }
            }
        }

        async function updateRequestsBadge() {
            if (!currentUser) return;
            const myProjectIds = allProjects.filter(p => p.user_id === currentUser.id).map(p => p.id);
            const badge = document.getElementById('requestsBadge');
            if (!badge) return;
            if (myProjectIds.length === 0) { badge.classList.add('hidden'); return; }

            const { count } = await supabaseClient.from('join_requests').select('*', { count: 'exact', head: true }).in('project_id', myProjectIds).eq('status', 'pending');
            if (count > 0) { badge.innerText = count > 99 ? '99+' : count; badge.classList.remove('hidden'); }
            else { badge.classList.add('hidden'); }
        }

        function setupGlobalRealtime() {
            if (globalSubscription) supabaseClient.removeChannel(globalSubscription);
            
            globalSubscription = supabaseClient.channel('global-updates')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                    const newMsg = payload.new;
                    if (String(newMsg.receiver_id) === String(currentUser.id)) {
                        if (activeChat.receiverId === newMsg.sender_id && activeChat.projectId === newMsg.project_id) {
                            markMessagesAsRead(newMsg.sender_id, newMsg.project_id);
                        } else { updateUnreadBadge(); }
                    }
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'join_requests' }, (payload) => {
                    updateRequestsBadge();
                    if (!document.getElementById('requestsModal').classList.contains('hidden')) openRequests();
                })
                .subscribe();
        }

        async function markMessagesAsRead(senderId, projectId) {
            await supabaseClient.from('messages').update({ is_read: true }).eq('receiver_id', currentUser.id).eq('sender_id', senderId).eq('project_id', projectId);
            updateUnreadBadge(); 
        }

        window.kickMember = async function(projectId, memberId, memberName) {

        // --- ОТПРАВКА ЗАЯВКИ ---
        window.sendJoinRequest = async function(projectId, authorId) {
            if (!currentUser) { alert("Войдите, чтобы подать заявку!"); return; }
            const { data } = await supabaseClient.from('join_requests').select('*').eq('project_id', projectId).eq('user_id', currentUser.id).maybeSingle();

            if (data) {
                if (data.status === 'pending') { alert("Вы уже подали заявку. Ждите ответа."); return; }
                if (data.status === 'approved') { alert("Вы уже приняты!"); return; }
                if (data.status === 'rejected') {
                    const { error } = await supabaseClient.from('join_requests').update({ status: 'pending' }).eq('id', data.id);
                    if (error) { alert("Ошибка!"); console.error(error); }
                    else { alert("Заявка отправлена повторно!"); document.getElementById('detailModal').classList.add('hidden'); document.getElementById('detailModal').classList.remove('flex'); }
                    return;
                }
            }

            const { error } = await supabaseClient.from('join_requests').insert([{ project_id: projectId, user_id: currentUser.id, status: 'pending' }]);
            if (error) { alert("Ошибка при отправке заявки!"); console.error(error); }
            else { alert("Заявка отправлена!"); document.getElementById('detailModal').classList.add('hidden'); document.getElementById('detailModal').classList.remove('flex'); }
        }

            if (error) { list.innerHTML = 'Ошибка загрузки.'; return; }

                    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                        <div class="flex justify-between items-start mb-2">

                const matchSearch = p.title.toLowerCase().includes(searchText) || (p.description && p.description.toLowerCase().includes(searchText));

                return matchSearch && matchRole;

            grid.innerHTML = '';
            if (filtered.length === 0) { grid.innerHTML = '<p class="text-gray-500 col-span-3 text-center py-8">Ничего не найдено.</p>'; return; }

        // --- ЧАТ ---
        async function openInbox() {
            const inboxList = document.getElementById('inboxList');
            inboxList.innerHTML = '<p class="text-center text-gray-400 text-sm mt-4">Загрузка...</p>';
            document.getElementById('inboxModal').classList.remove('hidden'); document.getElementById('inboxModal').classList.add('flex');

            const { data, error } = await supabaseClient.from('messages').select('*').or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`).order('created_at', { ascending: false });
            if (error) { inboxList.innerHTML = 'Ошибка загрузки.'; return; }
            if (data.length === 0) { inboxList.innerHTML = '<p class="text-center text-gray-400 text-sm mt-4">У вас пока нет сообщений.</p>'; return; }

            const chatsMap = new Map();
            data.forEach(msg => {
                const otherId = msg.sender_id === currentUser.id ? msg.receiver_id : msg.sender_id;
                const key = `${msg.project_id}_${otherId}`;
                if (!chatsMap.has(key)) chatsMap.set(key, { projectId: msg.project_id, otherId: otherId, lastMessage: msg.content, unreadCount: 0 });
                if (msg.receiver_id === currentUser.id && msg.is_read === false) chatsMap.get(key).unreadCount++;
            });

            inboxList.innerHTML = '';
            for (const chat of chatsMap.values()) {
                const project = allProjects.find(p => String(p.id) === String(chat.projectId));
                const otherProfile = allProfiles.find(p => p.id === chat.otherId);
                const projectTitle = project ? project.title : 'Удаленный проект';
                const otherName = otherProfile?.full_name || 'Пользователь';
                const badgeHTML = chat.unreadCount > 0 ? `<span class="bg-red-500 text-white text-xs font-bold px-2 py-0.5 rounded-full ml-2">${chat.unreadCount}</span>` : '';

                inboxList.insertAdjacentHTML('beforeend', `
                    <div onclick="openChatFromInbox('${chat.otherId}', ${chat.projectId}, '${projectTitle.replace(/'/g, "\\'")}')" class="bg-white p-3 rounded-lg shadow-sm border border-gray-200 cursor-pointer hover:bg-gray-50 transition flex flex-col">
                        <div class="flex justify-between items-center mb-1">
                            <div class="flex items-center"><span class="font-bold text-gray-800 text-sm">${otherName}</span>${badgeHTML}</div>
                            <span class="text-xs text-blue-600 bg-blue-50 px-2 py-0.5 rounded">${projectTitle}</span>
                        </div>
                        <p class="text-xs text-gray-500 truncate">${chat.lastMessage}</p>
                    </div>
                `);
            }
        }

        window.openChatFromInbox = function(receiverId, projectId, projectTitle) {
            document.getElementById('inboxModal').classList.add('hidden'); document.getElementById('inboxModal').classList.remove('flex');
            openChat(receiverId, projectId, projectTitle);
        }

        window.openChat = async function(receiverId, projectId, projectTitle) {
            if (!currentUser) { alert("Войдите, чтобы писать!"); return; }
            if (currentUser.id === receiverId) { alert("Это ваш проект!"); return; }
            
            activeChat = { receiverId, projectId };
            document.getElementById('chatTitle').innerText = "Чат по проекту";
            document.getElementById('chatSubtitle').innerText = projectTitle;
            document.getElementById('chatMessages').innerHTML = '<p class="text-center text-gray-400 text-sm">Загрузка...</p>';
            document.getElementById('chatModal').classList.remove('hidden'); document.getElementById('chatModal').classList.add('flex');
            
            await markMessagesAsRead(receiverId, projectId);
            await loadMessages();
            setupChatRealtime(receiverId, projectId);
            document.getElementById('chatInput').focus();
        }

        async function loadMessages() {
            if (!activeChat.receiverId || !activeChat.projectId) return;
            const { data, error } = await supabaseClient.from('messages').select('*').or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeChat.receiverId}),and(sender_id.eq.${activeChat.receiverId},receiver_id.eq.${currentUser.id})`).order('created_at', { ascending: true });
            if (error) { console.error("Ошибка:", error); return; }
            
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = '';
            const projectMessages = data.filter(msg => String(msg.project_id) === String(activeChat.projectId));
            
            if (!projectMessages || projectMessages.length === 0) { chatMessages.innerHTML = '<p class="text-center text-gray-400 text-sm mt-4">Начните диалог по этому проекту первым!</p>'; }
            else { projectMessages.forEach(msg => renderMessage(msg)); chatMessages.scrollTop = chatMessages.scrollHeight; }
        }

        function renderMessage(msg) {
            const isMine = msg.sender_id === currentUser.id;
            const time = new Date(msg.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('chatMessages').insertAdjacentHTML('beforeend', `
                <div class="flex ${isMine ? 'justify-end' : 'justify-start'}">
                    <div class="max-w-[75%] p-3 rounded-xl text-sm ${isMine ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white text-gray-800 border rounded-bl-none shadow-sm'}">
                        ${msg.content}
                        <div class="text-[10px] ${isMine ? 'text-blue-200' : 'text-gray-400'} text-right mt-1">${time}</div>
                    </div>
                </div>
            `);
        }

        function setupChatRealtime(receiverId, projectId) {
            if (chatSubscription) supabaseClient.removeChannel(chatSubscription);
            chatSubscription = supabaseClient.channel('chat-realtime')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                    const newMsg = payload.new;
                    if (String(newMsg.project_id) !== String(projectId)) return;
                    if ((String(newMsg.sender_id) === String(currentUser.id) && String(newMsg.receiver_id) === String(receiverId)) || (String(newMsg.sender_id) === String(receiverId) && String(newMsg.receiver_id) === String(currentUser.id))) {
                        const chatMessages = document.getElementById('chatMessages');
                        if (chatMessages.innerHTML.includes('Начните диалог')) chatMessages.innerHTML = '';
                        renderMessage(newMsg);
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                        if (String(newMsg.receiver_id) === String(currentUser.id)) markMessagesAsRead(receiverId, projectId);
                    }
                }).subscribe();
        }

        document.getElementById('chatForm').addEventListener('submit', async (e) => {

            const text = document.getElementById('chatInput').value.trim();

            document.getElementById('chatInput').value = '';

        });

        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.innerText = "Ждите...";
            const file = document.getElementById('input-image').files[0];
            let imageUrl = null;
            
            if (file) {
                const fileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '_')}`;
                const { error } = await supabaseClient.storage.from('project-images').upload(fileName, file);
                if (!error) { imageUrl = supabaseClient.storage.from('project-images').getPublicUrl(fileName).data.publicUrl; }
            }

            const projectData = {
                title: document.getElementById('input-title').value,
                deadline: document.getElementById('input-deadline').value,
                role: document.getElementById('input-role').value,
                description: document.getElementById('input-desc').value,
            };

            if (editingProjectId) {
                const current = allProjects.find(p => String(p.id) === String(editingProjectId));
                let finalImg = document.getElementById('delete-image-checkbox').checked ? null : current.image_url;
                if (file) finalImg = imageUrl;
                await supabaseClient.from('projects').update({...projectData, image_url: finalImg}).eq('id', editingProjectId);
            } else {
                await supabaseClient.from('projects').insert([{...projectData, user_id: currentUser.id, image_url: imageUrl}]);
            }

            btn.disabled = false; btn.innerText = "Опубликовать";
            document.getElementById('modal').classList.add('hidden'); document.getElementById('modal').classList.remove('flex'); document.getElementById('projectForm').reset(); editingProjectId = null;
            loadProjects();
        });

        checkUser();
    </script>
</body>
</html>
