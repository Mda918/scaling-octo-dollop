<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Научный Соавтор | Поиск команды</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Шапка сайта -->
    <header class="bg-white shadow">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600">НаучныйСоавтор</h1>
            
            <div class="flex items-center gap-4">
                <!-- Блок для кнопки авторизации (управляется через JS) -->
                <div id="auth-block">
                    <button id="loginBtn" class="text-blue-600 font-medium hover:underline">Войти / Регистрация</button>
                </div>
                
                <button id="openModalBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition">
                    + Создать объявление
                </button>
            </div>
        </div>
    </header>

    <!-- Основная часть -->
    <main class="max-w-5xl mx-auto px-4 py-8">
        <h2 class="text-xl font-semibold mb-4">Ищу соавтора</h2>

        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <input type="text" id="searchInput" placeholder="Поиск по названию..." class="w-full md:w-1/2 border border-gray-300 rounded-lg px-4 py-2">
            <select id="filterRole" class="w-full md:w-1/2 border border-gray-300 rounded-lg px-4 py-2">
                <option value="">Все роли (Кто нужен?)</option>
                <option value="Теоретик">Теоретик</option>
                <option value="Практик (врач)">Практик (врач)</option>
                <option value="Дизайнер">Дизайнер</option>
                <option value="Гуманитарий">Гуманитарий</option>
            </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Карточки -->
        </div>
    </main>

    <!-- Модальное окно СОЗДАНИЯ -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md mx-4 relative max-h-[90vh] overflow-y-auto">
            <button id="closeModalBtn" class="absolute top-4 right-4 text-gray-500 hover:text-red-500 font-bold text-xl">&times;</button>
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Новое объявление</h2>
            <form id="projectForm" class="flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Тема (название)</label>
                    <input type="text" id="input-title" required class="w-full border border-gray-300 rounded-lg px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Сроки</label>
                    <input type="text" id="input-deadline" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Кто нужен?</label>
                    <select id="input-role" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                        <option>Теоретик</option>
                        <option>Практик (врач)</option>
                        <option>Дизайнер</option>
                        <option>Гуманитарий</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Краткое описание</label>
                    <textarea id="input-desc" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ваши контакты (Telegram/Почта)</label>
                    <input type="text" id="input-contact" required class="w-full border border-gray-300 rounded-lg px-3 py-2" placeholder="@username или email@mail.ru">
                </div>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg mt-2">
                    Опубликовать
                </button>
            </form>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ОТКЛИКА -->
    <div id="respondModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md mx-4 relative">
            <button id="closeRespondBtn" class="absolute top-4 right-4 text-gray-500 hover:text-red-500 font-bold text-xl">&times;</button>
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Связаться с автором</h2>
            <p class="text-gray-600 mb-4">Чтобы стать соавтором проекта <strong id="respondTitle" class="text-gray-900"></strong>, напишите автору:</p>
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 text-center">
                <span id="respondContact" class="text-lg font-bold text-blue-700 select-all"></span>
            </div>
            <button id="closeRespondBtn2" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg mt-6 transition">Закрыть</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО АВТОРИЗАЦИИ (ВХОД/РЕГИСТРАЦИЯ) -->
    <div id="authModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md mx-4 relative">
            <button id="closeAuthBtn" class="absolute top-4 right-4 text-gray-500 hover:text-red-500 font-bold text-xl">&times;</button>
            <h2 class="text-2xl font-bold mb-4 text-gray-800">Вход в систему</h2>
            
            <form id="authForm" class="flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="auth-email" required class="w-full border border-gray-300 rounded-lg px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Пароль (мин. 6 символов)</label>
                    <input type="password" id="auth-password" required class="w-full border border-gray-300 rounded-lg px-3 py-2">
                </div>
                
                <div class="flex gap-2 mt-2">
                    <button type="submit" id="loginSubmitBtn" class="w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Войти</button>
                    <button type="button" id="signupSubmitBtn" class="w-1/2 bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg">Регистрация</button>
                </div>
                <p id="authMessage" class="text-sm text-center mt-2 hidden"></p>
            </form>
        </div>
    </div>

    <script>
        // --- НАСТРОЙКИ SUPABASE ---
        const supabaseUrl = 'https://afpqnklgtibofojlvjzm.supabase.co'; 
        const supabaseKey = 'sb_publishable_E023w2ojf9VIqr78rN5VWQ_jOu9uKDQ'; 
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null; // Здесь будем хранить вошедшего пользователя
        let allProjects = [];

        // --- ЭЛЕМЕНТЫ ---
        const modal = document.getElementById('modal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        const form = document.getElementById('projectForm');
        const grid = document.querySelector('.grid');
        const searchInput = document.getElementById('searchInput');
        const filterRole = document.getElementById('filterRole');

        // Авторизация элементы
        const authModal = document.getElementById('authModal');
        const loginBtn = document.getElementById('loginBtn');
        const closeAuthBtn = document.getElementById('closeAuthBtn');
        const authForm = document.getElementById('authForm');
        const authBlock = document.getElementById('auth-block');
        const authMessage = document.getElementById('authMessage');
        
        // Окно отклика
        const respondModal = document.getElementById('respondModal');
        const closeRespondBtn = document.getElementById('closeRespondBtn');
        const closeRespondBtn2 = document.getElementById('closeRespondBtn2');

        // --- УПРАВЛЕНИЕ ОКНАМИ ---
        openBtn.addEventListener('click', () => { 
            if(!currentUser) {
                alert("Чтобы создать объявление, нужно войти в аккаунт!");
                authModal.classList.remove('hidden'); authModal.classList.add('flex');
                return;
            }
            modal.classList.remove('hidden'); modal.classList.add('flex'); 
        });
        closeBtn.addEventListener('click', () => { modal.classList.add('hidden'); modal.classList.remove('flex'); });
        
        loginBtn.addEventListener('click', () => { authModal.classList.remove('hidden'); authModal.classList.add('flex'); });
        closeAuthBtn.addEventListener('click', () => { authModal.classList.add('hidden'); authModal.classList.remove('flex'); authMessage.classList.add('hidden'); });
        
        function openRespond(title, contact) {
            document.getElementById('respondTitle').innerText = title;
            document.getElementById('respondContact').innerText = contact || 'Автор не указал контакты';
            respondModal.classList.remove('hidden'); respondModal.classList.add('flex');
        }
        closeRespondBtn.addEventListener('click', () => { respondModal.classList.add('hidden'); respondModal.classList.remove('flex'); });
        closeRespondBtn2.addEventListener('click', () => { respondModal.classList.add('hidden'); respondModal.classList.remove('flex'); });

        // --- АВТОРИЗАЦИЯ ---
        // Проверяем, вошел ли кто-то при загрузке страницы
        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            updateAuthUI(session);
            
            // Слушаем изменения (вход/выход)
            supabaseClient.auth.onAuthStateChange((_event, session) => {
                updateAuthUI(session);
            });
        }

        function updateAuthUI(session) {
            if (session) {
                currentUser = session.user;
                // Показываем email и кнопку Выйти
                authBlock.innerHTML = `
                    <span class="text-sm text-gray-600 mr-2">${currentUser.email}</span>
                    <button id="logoutBtn" class="text-red-500 font-medium hover:underline text-sm">Выйти</button>
                `;
                document.getElementById('logoutBtn').addEventListener('click', async () => {
                    await supabaseClient.auth.signOut();
                });
            } else {
                currentUser = null;
                // Показываем кнопку Войти
                authBlock.innerHTML = `<button id="loginBtn" class="text-blue-600 font-medium hover:underline">Войти / Регистрация</button>`;
                document.getElementById('loginBtn').addEventListener('click', () => { 
                    authModal.classList.remove('hidden'); authModal.classList.add('flex'); 
                });
            }
            loadProjects(); // Перезагружаем карточки, чтобы обновить кнопки удаления
        }

        // Обработка формы входа
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                authMessage.innerText = "Ошибка: " + error.message;
                authMessage.className = "text-sm text-center mt-2 text-red-500 block";
            } else {
                authModal.classList.add('hidden'); authModal.classList.remove('flex');
                authForm.reset();
                authMessage.classList.add('hidden');
            }
        });

        // Обработка формы регистрации
        document.getElementById('signupSubmitBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            
            if(password.length < 6) {
                authMessage.innerText = "Пароль должен быть не менее 6 символов.";
                authMessage.className = "text-sm text-center mt-2 text-red-500 block";
                return;
            }

            const { error } = await supabaseClient.auth.signUp({ email, password });
            
            if (error) {
                authMessage.innerText = "Ошибка: " + error.message;
                authMessage.className = "text-sm text-center mt-2 text-red-500 block";
            } else {
                authMessage.innerText = "Успех! Если вы не отключили подтверждение почты, проверьте email.";
                authMessage.className = "text-sm text-center mt-2 text-green-600 block";
                authForm.reset();
            }
        });

        // --- ОТРИСОВКА КАРТОЧЕК ---
        function createCardHTML(project) {
            // Показываем кнопку удаления ТОЛЬКО если user_id карточки совпадает с ID текущего пользователя
            const isAuthor = currentUser && project.user_id === currentUser.id;
            const deleteBtnHTML = isAuthor 
                ? `<button onclick="deleteProject(${project.id})" class="text-red-500 hover:text-red-700 text-sm font-semibold">Удалить</button>`
                : '';

            return `
            <div class="bg-white rounded-xl shadow p-5 border border-gray-100 hover:shadow-md transition relative flex flex-col">
                <div class="flex justify-between items-start mb-3">
                    <span class="bg-blue-100 text-blue-700 text-xs px-2 py-1 rounded font-bold">Новое</span>
                    <span class="text-xs text-gray-400">${project.deadline}</span>
                </div>
                <h3 class="font-bold text-lg mb-2">${project.title}</h3>
                <p class="text-sm text-gray-600 mb-4 line-clamp-3 flex-grow">${project.description || 'Описание не добавлено.'}</p>
                <div class="flex items-center justify-between mt-auto pt-4 border-t border-gray-100">
                    <span class="text-xs font-medium text-gray-500">Нужен: ${project.role}</span>
                    <div class="flex gap-3">
                        <button onclick="openRespond('${project.title.replace(/'/g, "\\'")}', '${project.contact}')" class="text-blue-600 text-sm font-semibold hover:underline">Откликнуться</button>
                        ${deleteBtnHTML}
                    </div>
                </div>
            </div>
            `;
        }

        function renderProjects() {
            const searchText = searchInput.value.toLowerCase();
            const selectedRole = filterRole.value;

            const filtered = allProjects.filter(project => {
                const matchesSearch = project.title.toLowerCase().includes(searchText) || (project.description && project.description.toLowerCase().includes(searchText));
                const matchesRole = selectedRole === "" || project.role === selectedRole;
                return matchesSearch && matchesRole;
            });

            grid.innerHTML = '';
            if (filtered.length === 0) {
                grid.innerHTML = '<p class="text-gray-500 col-span-3 text-center py-8">Ничего не найдено.</p>';
                return;
            }
            filtered.forEach(project => {
                grid.insertAdjacentHTML('beforeend', createCardHTML(project));
            });
        }

        async function loadProjects() {
            const { data, error } = await supabaseClient.from('projects').select('*').order('id', { ascending: false });
            if (error) {
                console.error('Ошибка загрузки:', error);
            } else {
                allProjects = data;
                renderProjects();
            }
        }

        searchInput.addEventListener('input', renderProjects);
        filterRole.addEventListener('change', renderProjects);

        // --- УДАЛЕНИЕ ---
        async function deleteProject(id) {
            if(confirm('Точно удалить это объявление?')) {
                const { error } = await supabaseClient.from('projects').delete().eq('id', id);
                if (error) {
                    alert("Ошибка при удалении! Возможно, это не ваша карточка.");
                    console.error(error);
                } else {
                    loadProjects();
                }
            }
        }

        // --- ОТПРАВКА ФОРМЫ ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const titleText = document.getElementById('input-title').value;
            const deadlineText = document.getElementById('input-deadline').value || 'сроки не указаны';
            const roleText = document.getElementById('input-role').value;
            const descText = document.getElementById('input-desc').value;
            const contactText = document.getElementById('input-contact').value;

            // Добавляем user_id
            const { error } = await supabaseClient.from('projects').insert([
                { 
                    title: titleText, 
                    deadline: deadlineText, 
                    role: roleText, 
                    description: descText, 
                    contact: contactText,
                    user_id: currentUser.id 
                }
            ]);

            if (error) {
                alert('Ошибка при сохранении! Нажми F12 и посмотри консоль.');
                console.error(error);
            } else {
                loadProjects();
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                form.reset(); 
            }
        });

        // Инициализация
        checkUser();
    </script>
</body>
</html>
